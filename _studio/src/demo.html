<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>body{width:1280px;height:720px}
#stage{position:absolute;left:50px;top:30px;width:1180px;height:590px;overflow:hidden;border:3px solid #000;background:#fff;box-shadow:10px 10px 0 #00ec97}
#stage img{position:absolute;left:0;top:0;width:1180px;height:705px;transform-origin:0 0}
#cap{position:absolute;left:50px;right:50px;top:648px;display:flex;align-items:baseline;gap:18px}
#n{font-family:'IBM Plex Mono';font-size:12px;color:#4b4f4b;letter-spacing:.24em;white-space:nowrap}#ct{font-family:'Inter';font-size:24px;font-weight:600}
#prog{position:absolute;left:0;bottom:0;height:8px;background:#00ec97}
.full{position:absolute;inset:0;display:grid;place-items:center;text-align:center;background:#fff}
.h{font-family:'Unbounded';font-weight:900;font-size:64px;text-transform:uppercase;letter-spacing:-.03em;line-height:1}
.sub{font-family:'IBM Plex Mono';font-size:18px;letter-spacing:.22em;text-transform:uppercase;color:#4b4f4b;margin-top:18px}
.pill{display:inline-block;padding:12px 26px;border:3px solid #000;font-family:'Unbounded';font-weight:700;font-size:22px;box-shadow:8px 8px 0 #00ec97}
</style><body><div class="grid"></div>
<div id="stage"></div><div id="cap"><span id="n"></span><span id="ct"></span></div><div id="prog"></div>
<div class="full" id="intro"><div><div style="display:flex;align-items:center;justify-content:center;gap:22px"><span class="mk" style="width:80px;height:80px;font-size:50px">N</span><span class="h">NEAR OHM</span></div><div class="sub">the reserve currency of near · (3,3)</div></div></div>
<div class="full" id="outro"><div><div class="h" style="font-size:48px">Bond. Stake. <span class="gr">(3,3).</span></div><div style="margin-top:30px"><span class="pill" id="dom">@NearOHM</span></div></div></div>
<script>
const $=(i)=>document.getElementById(i),cl=(x)=>Math.max(0,Math.min(1,x)),e=(x)=>{x=cl(x);return x*x*(3-2*x)};
const q=new URLSearchParams(location.search);if(q.get('dom'))$('dom').textContent=q.get('dom');
const S=[[1.5,'01-landing','Live APY, index, treasury and backing on the front page',[1,.5,.5]],
[4,'02-moves','Three moves: bond NEAR, stake NOHM, (3,3)',[1.25,.5,.5]],
[6.6,'03-dash','The dashboard: protocol, your position, top stakers, live tape',[1.25,.4,.4]],
[9.2,'04-stake','Stake NOHM. The index ticks up every second, rebases every 8 hours',[1.3,.3,.45]],
[11.8,'05-bond','Bond NEAR at 6.5% or 12% off, vesting over 5 or 14 days',[1.25,.5,.45]],
[14.4,'06-desk','Deposit NEAR from any wallet. Verified on-chain before it is credited',[1.3,.35,.4]],
[16.8,'07-docs','Every formula and parameter in the docs',[1.2,.5,.3]],[19.2]];
const END=19.2,DUR=21;
S.slice(0,-1).forEach((s,i)=>{const im=new Image();im.src='../shots/'+s[1]+'.png';im.id='i'+i;$('stage').appendChild(im);});
const tf=(z,p)=>{const s=1+(z[0]-1)*p;const fx=z[1]*1180,fy=z[2]*705;let x=590-fx*s,y=295-fy*s;x=Math.min(0,Math.max(1180-1180*s,x));y=Math.min(0,Math.max(590-705*s,y));return `translate(${x}px,${y}px) scale(${s})`;};
window.__seek=(t)=>{
  $('intro').style.opacity=1-e((t-1.1)/.4);$('outro').style.opacity=e((t-END)/.4);$('prog').style.width=(t/DUR*1280)+'px';
  let k=0;for(let i=0;i<S.length-1;i++)if(t>=S[i][0])k=i;
  S.slice(0,-1).forEach((s,i)=>{const im=$('i'+i);im.style.opacity=i<=k?e((t-s[0])/.35):0;im.style.zIndex=i;const len=S[i+1][0]-s[0];im.style.transform=tf(s[3],e((t-s[0]-.15)/(len*.55)));});
  $('n').textContent=String(k+1).padStart(2,'0')+' / 07';$('ct').textContent=S[k][2];$('cap').style.opacity=e((t-S[k][0])/.3)*(t<END?1:0);
};window.__ready=Promise.all([...document.images].map((i)=>i.decode().catch(()=>0)));window.__seek(0);
</script>
